name: Publish Python 🐍 distributions 📦 to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: 3.12
    - name: Install wheel and setuptools
      run: >-
        python -m
        pip install
        wheel
        setuptools
        --user
        --upgrade
    - name: Build a binary wheel and a source tarball
      run: >-
        python3
        setup.py
        sdist
        bdist_wheel
    - name: Test install of the package
      run: >-
        python3 -m
        pip install
        dist/*.whl
    - name: Test import of the package
      # Must not run from the repo root: there, `import flybrains` picks up the
      # source tree instead of the installed wheel and passes even when the
      # wheel vendors no data files at all (see 0.6.0-0.6.2).
      working-directory: /tmp
      run: python3 -c "import flybrains"
    - name: Check that the wheel vendors all data files
      working-directory: /tmp
      run: python3 $GITHUB_WORKSPACE/tools/check_vendored_data.py
    - name: Check that the sdist is buildable
      run: |
        mkdir -p /tmp/sdist-check
        tar xzf dist/*.tar.gz -C /tmp/sdist-check
        cd /tmp/sdist-check/flybrains-*
        python3 setup.py --version
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1.13
      with:
        password: ${{ secrets.pypi_password }}
